name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  RELEASES: /var/www/mazen/frontend/releases

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://mazenkirtasiye.com/api/v1
          API_URL: https://mazenkirtasiye.com/api/v1
        run: npm run build

      - name: Standalone ciktiyi topla
        run: |
          mkdir -p out
          cp -r .next/standalone/. out/
          cp -r .next/static out/.next/static
          cp -r public out/public
          cp deploy/activate.sh out/activate.sh
          chmod +x out/activate.sh

      - name: SSH baglantisini hazirla
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host mazen-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh mazen-deploy "echo 'SSH baglantisi OK'"

      - name: Surum numarasi
        run: echo "REL=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      # rsync kullanmiyoruz: ubuntu-latest (24.04) imajinda rsync bulunmuyor
      - name: Dosyalari gonder
        run: |
          tar czf - -C out . \
          | ssh mazen-deploy \
              "mkdir -p ${{ env.RELEASES }}/${{ env.REL }} && tar xzf - -C ${{ env.RELEASES }}/${{ env.REL }}"

      - name: Yayina al
        run: |
          ssh mazen-deploy \
            "bash ${{ env.RELEASES }}/${{ env.REL }}/activate.sh ${{ env.REL }}"
